name: win-build

# on: workflow_dispatch

on:
  push:
    branches:
    - basta

jobs:
  build:
    name: Build release on windoz
    runs-on: windows-2022

    steps:    
      - uses: actions/checkout@v4
#      - uses: Jimver/cuda-toolkit@master
      - uses: ilammy/msvc-dev-cmd@v1 # This action sets up the environment
      
      - uses: Jimver/cuda-toolkit@v0.2.24
        id: cuda-toolkit
        with:
          cuda: '12.5.0'      
      
      - name: Build
        run: |        
          mkdir build
          cd build
          cmake -DBUILD_CUDA=OFF -DBUILD_OPENCL=OFF -DBUILD_BIT=ON ..
          devenv BEAGLE.sln /build "Release"
          cpack .
      - name: Upload CPack files
        uses: actions/upload-artifact@v4
        with:
          name: CPack files
          path: build
      - name: Upload installer package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: installer_package
          path: build/*.msi
