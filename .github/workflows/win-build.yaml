name: win-build

on: workflow_dispatch

jobs:
  build:
    name: Build release on windoz
    runs-on: windows-2019

    steps:
    - name: Checkout
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1 # This action sets up the environment
    - name: Build
      run: |        
        mkdir build
        cd build
        cmake ..
        devenv BEAGLE.sln /build "Release"
        cpack .
