name: win-build

# on: workflow_dispatch

on:
  push:
    branches:
    - basta

jobs:
  build:
    name: Build release on windoz
    runs-on: windows-2022

    steps:    
      - uses: actions/checkout@v4
    
      - uses: ilammy/msvc-dev-cmd@v1 # This action sets up the environment
      
#       - uses: Jimver/cuda-toolkit@v0.2.24
#         id: cuda-toolkit
#         with:
#           cuda: '12.5.0'      
      
      - name: Install OpenCL
        shell: powershell
        run: |
          curl https://registrationcenter-download.intel.com/akdlm/IRC_NAS/a8589e7b-70f8-4ef2-bdc3-7306dfb93e92/w_opencl_runtime_p_2025.2.0.768.exe
          ./w_opencl_runtime_p_2025.2.0.768.exe
#           curl https://github.com/KhronosGroup/OpenCL-SDK/releases/download/v2025.07.23/OpenCL-SDK-v2025.07.23-Win-x64.zip
#           ./OpenCL-SDK-v2025.07.23-Win-x64.zip          
      
      - name: Build
        run: |        
          mkdir build
          cd build
          cmake -DBUILD_CUDA=OFF -DBUILD_OPENCL=ON -DBUILD_BIT=ON ..
          devenv BEAGLE.sln /build "Release"
          cpack .
      - name: Upload CPack files
        uses: actions/upload-artifact@v4
        with:
          name: CPack files
          path: build
      - name: Upload installer package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: installer_package
          path: build/*.msi
