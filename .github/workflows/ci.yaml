name: CI

on:
  push:
    branches:
    - "*"
  pull_request:
    branches:
    - "*"

jobs:
  build:
    name: Build on Linux x86_64
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake file

    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DBEAGLE_INDEX_CHECKS=ON -DBEAGLE_OPTIMIZE_FOR_NATIVE_ARCH=OFF
        make -j
        file libhmsbeagle/libhmsbeagle.so.* | grep x86-64
        # libhmsbeagle loads the CPU plugins by file name; with Ubuntu's --as-needed and RUNPATH defaults the examples'
        # links to them do not make the build-tree plugins findable
        LD_LIBRARY_PATH=$PWD/libhmsbeagle/CPU ctest --output-on-failure

  build-aarch64:
    name: Build on Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc g++ openjdk-11-jdk file
    - name: Build
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-arm64
        mkdir build
        cd build
        cmake .. -DBEAGLE_INDEX_CHECKS=ON -DBEAGLE_OPTIMIZE_FOR_NATIVE_ARCH=OFF
        make -j
        file libhmsbeagle/libhmsbeagle.so.* | grep aarch64
        # libhmsbeagle loads the CPU plugins by file name; with Ubuntu's --as-needed and RUNPATH defaults the examples'
        # links to them do not make the build-tree plugins findable
        LD_LIBRARY_PATH=$PWD/libhmsbeagle/CPU ctest --output-on-failure

  # Build and test only: packaging and signing stay in win-build.yaml and mac-build.yaml
  build-windows:
    name: Build on Windows x64 (MSVC)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Java (for the JNI libraries)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Configure
      # CPU plugins, JNI and BIT; MASCOT as in mascot.yaml's Windows job (MSVC builds kernel A only); no GPU frameworks
      run: cmake -S . -B build -DBUILD_OPENCL=OFF -DBUILD_CUDA=OFF -DBUILD_SSE=ON -DBUILD_JNI=ON -DBUILD_BIT=ON -DBUILD_MASCOT=ON
    - name: Build
      run: cmake --build build --config Release --parallel 4
    - name: Test
      # the examples link hmsbeagle64.dll and the CPU plugins, and BEAGLE loads its plugins with LoadLibrary: both
      # search PATH for the per-configuration directories the Visual Studio generator writes the DLLs to
      run: |
        $env:PATH = "$PWD\build\libhmsbeagle\Release;$PWD\build\libhmsbeagle\CPU\Release;$env:PATH"
        ctest --test-dir build -C Release --output-on-failure

  build-macos:
    name: Build on macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Java (for the JNI libraries)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Configure
      # default options: MASCOT, OpenCL, JNI, SSE and spectral on
      run: cmake -S . -B build
    - name: Build
      run: cmake --build build --parallel 4
    - name: Test
      # GitHub's macOS VMs have no usable GPU, so the GPU, OpenCL-spectral and fused tests are left out; the opencl_*
      # discovery tests need no GPU and run
      run: ctest --test-dir build --output-on-failure -E 'gpu|openclspectraltest|fused'

  opencl-discovery-macos-arm64:
    name: OpenCL discovery on macOS arm64
    runs-on: macos-15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Build OpenCL tests
      run: |
        cmake -S . -B build -DBUILD_OPENCL=ON -DBUILD_CUDA=OFF -DBUILD_JNI=OFF
        cmake --build build --target test_opencl_discovery test_opencl_cpu_instance
    - name: Run OpenCL discovery tests
      run: ctest --test-dir build --output-on-failure -R 'opencl_.*'
        
